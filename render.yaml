# Render Blueprint — deploys the Vite + React frontend as a Static Site.
# In the Render dashboard: New -> Blueprint -> select this repo.
#
# After the first deploy, note your real *.onrender.com URL and:
#   1. Update VITE_API_BASE_URL below (or in the dashboard) to point at
#      your backend service's URL, then trigger a redeploy — Vite bakes
#      env vars into the build at build time, so changing them requires
#      a rebuild, not just a restart.
#   2. Add this frontend's URL to the backend's CORS_ALLOWED_ORIGINS env var.
services:
  - type: web
    name: smart-rental-frontend
    runtime: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://smart-rental-backend.onrender.com/api/"
      - key: VITE_MEDIA_URL
        value: "https://smart-rental-backend.onrender.com"
    routes:
      # React Router uses client-side routing — without this, a direct visit
      # or refresh on e.g. /dashboard/properties 404s because Render looks
      # for a literal /dashboard/properties file. Rewrite everything to
      # index.html so React Router can take over.
      - type: rewrite
        source: /*
        destination: /index.html
